[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "imact-execution-harness"
version = "0.2.0"
description = "IMAct execution harness: event protocol, task workspace and joint action decisions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162,<1", "uvicorn>=0.54,<1", "pydantic>=2.14,<3",
  "httpx2[socks]>=2.16,<3", "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
imact = "imact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imact = ["prompts/*.txt", "schemas/*.json", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
