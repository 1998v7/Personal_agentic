# 各领域的 agent 设置与 task 列表,取自上游 MCP-Universe 的 mcpuniverse/benchmark/configs/mcpuniverse/<domain>.yaml。
# 官方的 task 划分:web_search 55 / location_navigation 45 / repository_management 33 / financial_analysis 40 / browser_automation 39,
# 其中含 multi_server 里的 task(分散在各域)。3d_design(Blender)、MCPMark、deep research 不在本接入范围内。
# upstream_agent 只做记录:上游 web_search 用 harmony_react、financial_analysis 用 function_call,这里统一用 ReAct(见 README)。
